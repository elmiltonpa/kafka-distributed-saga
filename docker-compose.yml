version: '3.8'

services:
  # ========================================================
  # Apache Kafka (Broker en modo KRaft, sin ZooKeeper)
  # ========================================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - poc-network

  # ========================================================
  # Inicializador de Tópicos de Kafka (3 particiones por tópico)
  # ========================================================
  kafka-init:
    image: apache/kafka:latest
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/tmp/create-topics.sh:ro
    entrypoint: ["/bin/sh", "/tmp/create-topics.sh"]
    restart: "no"
    networks:
      - poc-network

  # ========================================================
  # Kafka UI (kafbat/kafka-ui) para observabilidad gráfica
  # ========================================================
  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - poc-network

  # ========================================================
  # MongoDB (Replica Set de 1 nodo para soportar transacciones)
  # ========================================================
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - poc-network

  # ========================================================
  # Inicializador del Replica Set de MongoDB
  # ========================================================
  mongo-init:
    image: mongo:7.0
    container_name: mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Inicializando replica set rs0 en MongoDB..."
        mongosh --host mongo:27017 --eval "
          try {
            rs.status();
            console.log('Replica set ya se encuentra iniciado.');
          } catch(e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongo:27017' }]
            });
            console.log('Replica set inicializado con exito.');
          }
        " --quiet
    restart: "no"
    networks:
      - poc-network

  # ========================================================
  # Mailhog (Servidor SMTP simulado + Web UI)
  # ========================================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    ports:
      - "8025:8025" # Interfaz Web
      - "1025:1025" # Puerto SMTP
    networks:
      - poc-network

networks:
  poc-network:
    name: poc-network
    driver: bridge

volumes:
  kafka_data:
  mongo_data:
